[package]
name = "dv3"
version = "1.0.0"
description = "Powerful minimalist 3D Viewer"
license = "GPL-3.0-only"
edition = "2021"

[[bin]]
name = "3Dv"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
tokio = { version = "1", features = ["sync", "time"] }

# Smaller, faster binary: quicker to load at every start and every Explorer
# thumbnail run (same as Hyper and Farba).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
